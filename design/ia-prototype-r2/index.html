let toastTimer,returnFocus,transitionToken=0,dialogGeneration=0;
function toast(text){clearTimeout(toastTimer);const host=document.getElementById('toast');host.innerHTML=`<div class="toast">${esc(text)}</div>`;toastTimer=setTimeout(()=>{const n=host.firstElementChild;if(!n)return;const a=motion()?n.animate([{opacity:1},{opacity:0}],{duration:140}):null;(a?.finished||Promise.resolve()).then(()=>n.remove());},3200);}
const motion=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches;
function paint(animate=false){persist();const update=()=>{renderNav();renderTop();document.getElementById('main').innerHTML=pages[s.screen]();};if(animate&&motion()&&document.startViewTransition){const token=++transitionToken;document.startViewTransition(()=>{if(token===transitionToken)update();}).finished.catch(()=>{});}else update();}
function go(screen){clearTimeout(toastTimer);document.getElementById('toast').innerHTML='';s.screen=screen;s.selected=[];s.query='';s.tab='全部达人';paint(true);}
function invalidate(){s.rev++;s.approval=null;if(s.plan){s.plan.status='stale';s.plan.prepared=[];}s.cloud=null;}
function runRows(){return s.runKey==='current'?s.rows.filter(r=>s.job.ids.slice(0,s.job.done).includes(r.id)&&!s.job.skippedIds?.includes(r.id)):s.rows;}
function filtered(){return (s.screen==='discover'?s.rows:runRows()).filter(r=>(s.screen!=='discover'||r.candidate)&&(!s.query||[r.name,r.category,r.note].join(' ').toLowerCase().includes(s.query.toLowerCase()))&&(s.tab==='全部达人'||s.tab==='待复核'&&r.status==='待复核'||s.tab==='待补联系'&&!r.email&&!r.wechat||s.tab==='已选建联'&&r.outreach)&&(s.contactFilter==='all'||s.contactFilter==='yes'&&(r.email||r.wechat)||s.contactFilter==='no'&&!r.email&&!r.wechat));}
function renderNav(){const navs=[['overview','home','项目概览'],['discover','search','发现与候选'],['jobs','task','采集任务'],['library','people','达人复核'],['delivery','send','建联交付']];document.getElementById('nav').innerHTML=`<div class="brand row"><span class="brandmark">${ico('spark',20)}</span><div><b>蒲公英</b><small style="display:block;font-size:9px;letter-spacing:2px">CREATOR WORKSPACE</small></div></div><div class="projectpick"><div class="eyebrow">当前合作项目</div><strong>${esc(s.project)}</strong></div><div class="navlabel">工作空间</div>${navs.map(([key,icon,name])=>`<button class="navitem ${s.screen===key?'active':''}" data-action="go:${key}" title="${name}" ${s.screen===key?'aria-current="page"':''}>${ico(icon)}<span class="navtext">${name}</span>${key==='library'?`<span class="navcount">${s.rows.length}</span>`:key==='jobs'&&!['idle','completed','stopped'].includes(s.job.status)?'<span class="navcount">1</span>':''}</button>`).join('')}<div class="sidebarbottom"><button class="navitem ${s.screen==='history'?'active':''}" data-action="go:history" title="历史与分析">${ico('clock')}<span class="navtext">历史与分析</span></button><button class="navitem ${s.screen==='tools'?'active':''}" data-action="go:tools" title="设置与维护">${ico('settings')}<span class="navtext">设置与维护</span></button><div class="user"><span class="avatar">演</span><div class="userinfo"><b style="font-size:11px">演示工作空间</b><small style="display:block;font-size:9px">本机保存 · 虚构数据</small></div></div></div>`;}
function renderTop(){const title={overview:'项目概览',discover:'发现与候选',jobs:'采集任务',library:'达人复核',delivery:'建联交付',history:'历史与分析',tools:'设置与维护'}[s.screen];document.getElementById('top').innerHTML=`<div class="row breadcrumb"><span>合作项目</span>${ico('chev',12)}<span>${esc(s.project)}</span>${ico('chev',12)}<strong>${title}</strong></div><div class="row"><span class="protochip">交互原型 · 虚构数据 · 无外部连接</span><button class="iconbtn prototype-reset" data-action="reset" title="重置虚构演示数据" aria-label="重置虚构演示数据">${ico('clock',15)}</button></div>`;}

function overview(){const selected=s.rows.filter(r=>r.outreach).length;return heading('让下一次合作，从这里开始','把发现、采集和建联留在同一个项目里',btn(ico('plus')+' 新建合作项目','project-new'))+`<div class="projecthero"><div><div class="eyebrow">AUTUMN HOME · 2026</div><h2>${esc(s.project)}</h2><p>寻找真实生活感的家居创作者。优先关注好物分享与空间改造，先复核内容，再决定合作方式。</p><div class="flowline">${['发现','初筛','采集','复核','交付'].map((x,i)=>`<button class="flowstep ${i<3?'done':i===3?'active':''}" data-action="go:${['discover','discover','jobs','library','delivery'][i]}">${i<3?'✓ ':''}${x}</button>`).join('')}</div></div><div class="resume"><span class="eyebrow">接着上次的位置</span><b>还有 ${s.rows.filter(r=>r.status==='待复核').length} 位达人等待复核</b><p>已采集资料保留，无需重新开始。</p><div class="gap"></div>${btn('继续复核 '+ico('arrow'),'go:library','primary')}</div></div><div class="overview-bottom"><div><div class="sectionheading row spread"><h3>本项目采集任务</h3>${btn('查看全部','go:jobs','quiet small')}</div><div class="panel"><div class="taskrow"><div><h3>家居场景 · 第一批</h3><p>今天 14:20 · 公开资料 · 8 位</p></div>${pill('待复核','blue')}<span class="smallstat">完成 8 / 8</span>${btn('复核结果','go:library','small')}</div><div class="taskrow"><div><h3>好物分享 · 第二批</h3><p>尚未创建 · 从候选名单开始</p></div>${pill('草稿')}<span class="smallstat">候选 ${s.rows.length} 位</span>${btn('整理候选','go:discover','small')}</div></div><div class="sectionheading"><h3>待处理事项</h3></div><div class="panel panelpad"><div class="compactrow"><span>${pill(String(s.rows.filter(r=>!r.email&&!r.wechat).length),'amber')} 位缺少公开联系方式</span>${btn('去补充','view-missing','quiet small')}</div><div class="compactrow"><span>${pill('1','red')} 位采集失败，已有资料仍保留</span>${btn('查看原因','show-failure','quiet small')}</div></div></div><div><div class="sectionheading"><h3>本项目进展</h3></div><div class="panel panelpad"><div class="compactrow"><span class="muted">候选名单</span><strong>${s.rows.length} 位</strong></div><div class="compactrow"><span class="muted">已选建联</span><strong>${selected} 位</strong></div><div class="compactrow"><span class="muted">已准备未发送</span><strong>${s.plan?.prepared?.length||0} 位</strong></div><div class="gap"></div><div class="notice">准备与发送分别记账。已准备的达人仍保留在待建联名单。</div></div></div></div>`;}

function table(){const rows=filtered(),chosen=s.selected.filter(id=>rows.some(r=>r.id===id));return `<div class="listpanel">${chosen.length?`<div class="bulkbar" role="region" aria-label="当前筛选批量操作"><b>已选 ${chosen.length} 位</b>${s.screen==='discover'?btn('标为优先','priority','small')+btn('排除','exclude','small')+btn('创建采集任务','collect','primary small'):btn('选入建联','include','primary small')+btn('补充联系方式','enrich','small')+btn('移出建联','uninclude','small')}${btn('取消选择','clear-selection','quiet small')}</div>`:''}<div class="tablewrap"><table aria-label="${s.screen==='discover'?'候选名单':'达人复核名单'}"><thead><tr><th class="checkcol"><input type="checkbox" aria-label="选择当前筛选全部达人" id="select-filter" ${rows.length&&chosen.length===rows.length?'checked':''}></th><th class="namecol">达人 / 内容方向</th><th style="width:12%">粉丝</th><th class="tableoptional" style="width:13%">图文报价</th><th style="width:19%">${s.screen==='discover'?'初筛状态':'联系方式'}</th><th style="width:19%">${s.screen==='discover'?'采集建议':'跟进'}</th></tr></thead><tbody>${rows.map(r=>`<tr data-row="${r.id}" class="${s.focus===r.id?'focused':''}" tabindex="0" aria-label="查看${esc(r.name)}详情"><td class="checkcol"><input type="checkbox" aria-label="选择${esc(r.name)}" data-select="${r.id}" ${s.selected.includes(r.id)?'checked':''}></td><td><div class="cellname"><span class="avatar s" style="background:${palette[(r.id-1)%8]}">${r.name[0]}</span><div><b>${esc(r.name)}</b><small>${esc(r.category)}</small></div></div></td><td>${r.fans}</td><td class="tableoptional"><span class="muted">¥ ${r.price}</span></td><td>${s.screen==='discover'?pill(r.excluded?'已排除':r.priority,r.excluded?'':r.priority==='优先'?'blue':''):pill(r.email?'邮箱已核实':r.wechat?'微信已核实':'待补联系',r.email||r.wechat?'green':'amber')}</td><td>${s.screen==='discover'?`<span class="muted">${r.excluded?'不采集':'待采集'}</span>`:pill(r.outreach?'要建联':r.status,r.outreach?'blue':r.status==='采集失败'?'red':'')}</td></tr>`).join('')}</tbody></table>${!rows.length?`<div class="empty">${ico('search',27)}<h3>没 function jobs(){const j=s.job;return heading('采集任务','任务、结果和异常放在同一个上下文里',btn('从候选创建任务','go:discover'))+`<div class="sectiontabs"><button class="active">当前任务</button><button data-action="go:history">历史执行记录</button></div>${j.status==='idle'?`<div class="panel empty">${ico('task',30)}<h3>从一份确认过的候选名单开始</h3><p>先选择范围与规则，启动前再次确认账号和数量</p><div class="gap"></div>${btn('去整理候选','go:discover','primary')}</div>`:`<div class="joblayout"><section class="panel panelpad"><div class="row spread"><div><div class="eyebrow">RUN · DEMO-20261015-02</div><h2 style="margin-top:6px">家居场景 · 新一批采集</h2></div>${pill(jobLabels[j.status],['risk','save_error'].includes(j.status)?'red':j.status==='completed'?'green':'blue')}</div><div class="progress" role="progressbar" aria-valuenow="${j.done}" aria-valuemin="0" aria-valuemax="${j.total}"><div style="width:${j.done/j.total*100}%"></div></div><div class="row spread"><span class="muted">已处理 ${j.done} / ${j.total} 位</span><span class="muted">串行 · 保守等待 · 不跳过安全检查</span></div><div class="jobstats"><div><small>已保存</small><strong>${j.done-(j.skippedIds?.length||0)}</strong></div><div><small>待处理</small><strong>${j.total-j.done}</strong></div><div><small>失败</small><strong>${j.status==='save_error'?1:0}</strong></div><div><small>已跳过</small><strong>${j.skippedIds?.length||0}</strong></div></div><div class="gap"></div>${['pause_requested','stop_requested','skip_requested'].includes(j.status)?`<div class="notice warn">${j.status==='pause_requested'?'暂停':j.status==='skip_requested'?'跳过':'停止'}请求已收到，当前对象到达安全点后才生效。${btn('模拟到达安全点','safe-point','small')}${j.status==='pause_requested'?btn('撤销待暂停','cancel-pause','small'):''}</div>`:j.status==='risk'?`<div class="notice error"><b>平台出现安全验证，整批已停止</b><p>保留已保存的 ${j.done} 位。没有继续下一人，也没有自动导航。请人工处理风险，之后重新核对任务。</p><div class="gap"></div>${btn('查看已保存结果','review-job','small')}</div>`:j.status==='login'?`<div class="notice warn"><b>登录已失效</b><p>进度已保留。人工登录并重新检查后才能继续。</p><div class="gap"></div>${btn('打开受保护搜索页','browser:collection','small')}${btn('模拟人工登录并复查','restore-login','small')}</div>`:j.status==='save_error'?`<div class="notice error"><b>本地结果没有保存成功</b><p>当前对象未记为完成，不会自动处理下一人。</p><div class="gap"></div>${btn('检查后重新保存当前对象','retry-save','small')}</div>`:j.status==='completed'?`<div class="notice success"><b>本批处理完成 · 已保存 ${j.done-(j.skippedIds?.length||0)} 位，跳过 ${j.skippedIds?.length||0} 位</b><p>下一步由你复核；尚未补采联系方式或发送邀约。</p><div class="gap"></div>${btn('去复核本批结果','review-job','primary small')}</div>`:j.status==='stopped'?`<div class="notice">本批已停止，${j.done} 位结果保留。未自动启动后续操作。</div>`:`<div class="row wrap">${j.status==='running'?btn(ico('pause',14)+' 请求暂停','pause'):btn('继续任务','resume','primary')}${j.status==='running'?btn('请求跳过当前','skip'):''}${btn('停止整批','stop','danger')}${j.status==='running'?btn('模拟处理下一位','advance','quiet'):''}</div>`}<div class="gap"></div><h3>本批队列</h3>${j.ids.map((id,i)=>`<div class="queueitem"><span class="avatar s">${byId(id).name[0]}</span><span class="grow">${byId(id).name}</span>${pill(j.skippedIds?.includes(id)?'已跳过':i<j.done?'已保存':i===j.done&&!['stopped','completed','risk'].includes(j.status)?'当前对象':'待处理',i<j.done?'green':i===j.done?'blue':'')}</div>`).join('')}<details style="margin-top:20px"><summary class="muted">查看运行日志与结果证据</summary><div class="gap"></div>${j.events.map(e=>`<p class="mono muted">${esc(e)}</p>`).join('')}${btn('查看证据目录','evidence','quiet small')}</details></section><aside><div class="panel panelpad"><h3>本批运行规则</h3><div class="kvlist"><div><span class="muted">采集账号</span><span>采集专用 · 演示</span></div><div><span class="muted">采集上限</span><span>50 人</span></div><div><span class="muted">规则</span><span>公开资料 v3</span></div><div><span class="muted">批次冷却</span><span>至少 5 分钟</span></div></div><div class="gap"></div><div class="notice">请求与生效分开显示。风控优先停止，已保存资料不丢失。</div></div><div class="panel panelpad" style="margin-top:16px"><div class="eyebrow">原型状态演示</div><p class="muted" style="margin:8px 0">手动推进演示，不代表真实采集速度</p><select id="job-scenario" aria-label="异常场景"><option value="normal">正常采集</option><option value="login" ${j.mode==='login'?'selected':''}>下一位遇到登录失效</option><option value="risk" ${j.mode==='risk'?'selected':''}>下一位遇到风控</option><option value="save_error" ${j.mode==='save_error'?'selected':''}>下一位保存失败</option></select></div></aside></div>`}`;}
function delivery(){const p=s.plan;const eligible=runRows().filter(r=>r.outreach);if(!p)return heading('建联交付','把名单、话术和执行方式核对清楚，再交付',btn('返回达人复核','go:library'))+`<div class="panel empty">${ico('send',30)}<h3>${eligible.length?`已有 ${eligible.length} 位达人选入建联`:'还没有选入建联的达人'}</h3><p>勾选行只是选择批量操作对象；请先确认“选入建联”</p><div class="gap"></div>${btn(eligible.length?'用已选达人生成方案':'去复核达人',eligible.length?'plan':'go:library','primary')}</div>`;const stale=p.status==='stale'||p.version!==s.rev;const rows=p.ids.map(byId).filter(Boolean),current=rows[p.index]||rows[0];return heading('建联交付','名单 → 话术 → 未发送准备 → 导出 / 飞书交接',btn('导出交付表','export')+btn('飞书交接','cloud','primary'))+`<div class="planlayout"><aside><div class="panel"><div class="panelpad" style="border-bottom:1px solid var(--line)"><h3>本次名单 <span class="muted">${rows.length} 位</span></h3><p class="muted">来自 ${esc(s.project)}</p></div>${rows.map((r,i)=>`<button class="recipient ${p.index===i?'active':''}" data-action="recipient:${i}"><span class="avatar s" style="background:${palette[(r.id-1)%8]}">${r.name[0]}</span><div class="grow"><b>${r.name}</b><br><small>${p.prepared.includes(r.id)?'已准备 · 未发送':'等待准备'}</small></div>${p.prepared.includes(r.id)?ico('check',14):''}</button>`).join('')}</div><div class="scopehint">准备不会更改“要建联”勾选或记为已联系</div></aside><section class="panel"><div class="plantop"><div class="row spread"><div class="row"><h3>${esc(current.name)}</h3>${pill(p.prepared.includes(current.id)?'已准备未发送':'待准备',p.prepared.includes(current.id)?'green':'')}</div><span class="smallstat">${p.index+1} / ${rows.length}</span></div><div class="gap"></div><div class="row wrap"><span class="muted">执行方式</span>${['蒲公英邀约','邮件建联','微信交接'].map(c=>btn(c,'channel:'+c,c===p.channel?'primary small':'small')).join('')}</div></div><div class="planbody">${stale?`<div class="notice warn">名单或资料已更改，旧准备已失效。${btn('重新核对本次名单','plan','small')}</div>`:p.unknown?`<div class="notice error"><b>执行结果不明，禁止自动重试</b><p>先核对目标平台上的实际结果，不能再次发送。</p>${btn('模拟只读核对结果','resolve-unknown','small')}</div>`:p.status==='completed'?`<div class="notice success"><b>本批未发送准备已完成</b><p>已处理 ${rows.length}/${rows.length} · 已准备未发送 ${p.prepared.length} · 已发送 0</p></div>`:`<div class="notice">${p.channel==='蒲公英邀约'?'使用独立邀约账号，仅准备当前达人表单；最终发送须人工逐人确认。':p.channel==='邮件建联'?'只交接邮件草稿，不自动补采、不发送邮件。':'只导出普通交接表；本原型不生成可执行小蜜蜂文件。'}</div>`}<div class="row spread" style="margin:21px 0 13px"><h3>合作内容</h3>${btn('修改话术','template','quiet small')}</div><div class="two"><div class="attr"><span>品牌</span><span>秋日居家 DEMO</span></div><div class="attr"><span>产品</span><span>家居香氛演示装</span></div><div class="attr"><span>期望发布</span><span>2026.10.20 – 10.31</span></div><div class="attr"><span>对接方式</span><span>demo@example.test</span></div></div><div class="draftpaper"><span class="eyebrow">MESSAGE PREVIEW</span><h3 style="margin-top:11px">你好，${esc(current.name)}</h3><p style="white-space:pre-wrap">${esc(p.message)}</p><div class="gap"></div><span class="tag">演示话术 · 未发送</span></div><div class="row spread" style="margin-top:17px"><span class="muted">批次准备 ${p.prepared.length} / ${rows.length} · 发送 0</span><span>${btn('执行审批','approval','quiet small')}${btn('查看邀约账号','browser:invite','quiet small')}</span></div></div><div class="plan-actions"><span class="muted">${p.prepared.includes(current.id)?'已回读模拟表单 · 等待你的下一步':'只准备当前对象，不自动切到下一位'}</span><div class="row wrap">${p.channel==='邮件建联'?btn('查看邮箱交接','mail-handoff','primary'):p.channel==='微信交接'?btn('导出普通交接表','export','primary'):p.prepared.includes(current.id)&&p.status!=='completed'?btn(p.index<rows.length-1?'不发送，准备下一位':'不发送，完成本批准备','unsent-next','primary'):btn(p.status==='completed'?'准备已完成':p.status==='preparing'?'准备中…':'仅准备，不发送','prepare','primary',stale||p.unknown||p.status==='completed'||p.status==='preparing'?'disabled':'')}${btn('最终发送','no-send','','disabled title="原型不提供真实发送"')}</div></div></section></div>`;}
const toolItems=[['accounts','globe','账号与网页','采集、详情、补采、邀约、邮箱分开管理'],['calibration','settings','采集校准','结果页三步校准、详情字段与跨页复验'],['templates','file','话术模板','新增、另存、默认模板与本次草稿'],['feishu','people','飞书连接与经纪人','保存连接、限定数据范围、明确经纪人身份'],['maintenance','shield','测试对象维护','精确预览与人工确认，正式记录禁止测试清理'],['recording','play','录制回放','保留开始、停止保存、回放与文件管理入口']];
function tools(){return heading('设置与维护','低频工具离开主流程，关键故障仍就地说明')+`<div class="toolgrid">${toolItems.map(([id,icon,title,desc])=>`<button class="panel toolcard" data-action="tool:${id}"><span style="color:var(--blue)">${ico(icon,22)}</span><h3>${title}</h3><p>${desc}</p><span class="linkbtn">打开 ${ico('arrow',13)}</span></button>`).join('')}</div><div class="dataflag">原型内所有连接、账号、文件和记录均为虚构。此处不读取本机业务配置。</div>`;}
function history(){return heading('历史与分析','从执行记录回到同一批结果，不必重新挑选文件夹',btn('AI 分析','tool:analysis'))+`<div class="sectiontabs"><button class="active">执行与导出</button><button data-action="tool:analysis">分析与知识库</button></div><div class="panel"><div class="taskrow"><div><h3>家居场景 · 第一批</h3><p>DEMO-20261015-01 · 8 位 · 质量摘要 2 项待补充</p></div>${pill('已保存','green')}<span class="muted">今天 14:28</span>${btn('打开本批复核','go:library','small')}</div>${s.exports.map(e=>`<div class="taskrow"><div><h3>${e.name}</h3><p>虚构数据 · ${e.count} 位 · ${e.scope}</p></div>${pill('已导出','blue')}<span class="muted">本次演示</span>${btn('重新打开导出','export','small')}</div>`).join('')}<div class="taskrow"><div><h3>签约搜索草稿 · 好物分享</h3><p>保留来源、初筛状态、渠道、备注与采集范围</p></div>${pill('未启动')}<span class="muted">上次保存</span>${btn('恢复到候选','restore-candidates','small')}</div></div><div class="gap"></div><div class="notice">任务记录与原始证据分别保留。清空执行队列不会删除候选、采集结果或用户模板。</div><div class="actionmenu">${btn('查看结果证据','evidence')}${btn('同步历史到分析','tool:analysis')}${btn('管理搜索草稿','tool:drafts')}</div>`;}

function openDialog(title,body,foot='',wide=false){const d=document.getElementById('modal');dialogGeneration++;d.getAnimations().forEach(a=>a.cancel());if(!d.open)returnFocus=document.activeElement;d.className='dialog'+(wide?' wide':'');d.innerHTML=`<div class="dialoghead row spread"><div><h2 id="dialog-title">${title}</h2></div><button class="iconbtn" data-action="close" aria-label="关闭弹窗">${ico('close')}</button></div><div class="dialogbody">${body}</div>${foot?`<div class="dialogfoot">${foot}</div>`:''}`;if(!d.open)d.showModal();d.scrollTop=0;}
async function closeDialog(){const d=document.getElementById('modal');if(!d.open)return;const generation=dialogGeneration;if(motion())await d.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(6px)'}],{duration:110}).finished.catch(()=>{});if(generation!==dialogGeneration)return;d.close();d.innerHTML='';if(returnFocus?.isConnected)returnFocus.focus();else document.getElementById('main').focus({preventScroll:true});}
function confirmDialog(title,body,action,label='确认'){openDialog(title,body,btn('返回','close')+btn(label,action,'primary'));}
function selection(){return s.selected.filter(id=>filtered().some(r=>r.id===id)).map(byId);}
function edit(id){const r=byId(id);s.editing=id;openDialog('复核达人资料',`<div class="row" style="margin-bottom:20px"><span class="avatar">${r.name[0]}</span><div><h3>${r.name}</h3><small>只修改本项目的复核判断</small></div></div><div class="two"><label class="field">初筛判断<select id="edit-priority">${['优先','待复核','排除'].map(v=>`<option ${r.priority===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">跟进状态<select id="edit-status">${['待复核','待建联','已建联','不建联','采集失败'].map(v=>`<option ${r.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">邮箱<input class="input" id="edit-email" value="${esc(r.email)}"></label><label class="field">微信<input class="input" id="edit-wechat" value="${esc(r.wechat)}"></label><label class="field">执行方式<select id="edit-channel">${['自动分流','蒲公英邀约','邮件建联','微信交接'].map(v=>`<option ${r.channel===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">不建联原因<input class="input" id="edit-reason" value="${esc(r.excludeReason||'')}"></label></div><label class="field">复核备注<textarea id="edit-note">${esc(r.note)}</textarea></label><div class="notice">修改身份、名单或话术会撤销旧准备；补采不会覆盖人工填写值。</div>`,(s.screen==='discover'?btn('移除此候选','remove-one','danger'):'')+btn('取消','close')+btn('保存复核资料','save-edit','primary'));}
function collect(){let rows=selection();if(!rows.length)rows=s.rows.filter(r=>r.candidate&&!r.excluded);if(!rows.length){toast('先加入至少一位未排除的候选');return;}s.collectIds=rows.map(r=>r.id);openDialog('创建采集任务',`<div class="notice">只采集本次确认的名单。已排除者默认不进入队列。</div><div class="gap"></div><div class="two"><label class="field">采集范围<select id="collect-scope"><option value="selected">当前选择 / 优先 + 待复核（${rows.length} 人）</option><option value="priority">只采优先</option><option value="all">全部候选（含排除，需单独确认）</option><option value="recent">最近加入的一段</option></select></label><label class="field">速度<select><option>标准 · 串行低频</option><option>更保守 · 更长间隔</option></select></label></div><div class="kvlist"><div><span>采集账号</span>${pill(s.login?'已人工登录':'尚未人工登录',s.login?'green':'amber')}${btn(s.login?'重新检测':'模拟人工登录','login-dialog','small')}</div><div><span>采集规则 · 公开资料 v3</span>${pill(s.calibrated?'本次已验证':'需要复验',s.calibrated?'green':'amber')}${btn('复验校准','tool:calibration','quiet small')}</div><div><span>数量与上限</span><strong>${rows.length} / 50 位</strong></div></div><div class="gap"></div><label class="check"><input type="checkbox" id="collect-ack">已核对名单及账号；了解串行等待、至少 5 分钟批次冷却、人工检查点和风控立即停止</label><div class="scopehint">这是手动推进的原型。原型的演示速度不会修改实际采集策略。</div>`,btn('返回候选','close')+btn('开始模拟采集','start-job','primary'));}
function makePlan(){const ids=runRows().filter(r=>r.outreach).map(r=>r.id);if(!ids.length){toast('先在达人复核中“选入建联”，再生成方案');go('library');return;}s.plan={ids,index:0,version:s.rev,status:'draft',prepared:[],channel:'蒲公英邀约',message:'我们正在策划一组秋日居家内容，很喜欢你对生活细节的表达。希望邀请你体验家居香氛演示装，一起分享属于秋天的居家灵感。\n\n如有兴趣，欢迎回复确认档期与合作方式。',unknown:false};go('delivery');}

n('检测登录','demo:模拟检测通过，不证明实际登录')}</div></div>`,btn('回到工作台','close'),true);return;}if(kind==='toggle-outreach'){const r=byId(val);r.outreach=!r.outreach;if(r.outreach)r.status='待建联';invalidate();paint();toast(r.outreach?'已选入建联，尚未准备或发送':'已移出建联');return;}if(kind==='channel'){s.approval=null;s.plan.channel=val;s.plan.prepared=[];s.plan.status='draft';s.plan.unknown=false;paint();toast('执行方式已更改，旧准备已撤销');return;}if(kind==='recipient'){if(s.plan.status==='preparing'){toast('当前对象正在准备，请先等待本次回读');return;}s.plan.index=Number(val);paint(true);return;}

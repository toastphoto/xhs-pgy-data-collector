function filtered(){return (s.screen==='discover'?s.rows:runRows()).filter(r=>(s.screen!=='discover'||r.candidate)&&(!s.query||[r.name,r.category,r.note].join(' ').toLowerCase().includes(s.query.toLowerCase()))&&(s.tab==='全部达人'||s.tab==='待复核'&&r.status==='待复核'||s.tab==='待补联系'&&!r.email&&!r.wechat&&!r.phone||s.tab==='已选建联'&&r.outreach)&&(s.contactFilter==='all'||s.contactFilter==='yes'&&(r.email||r.wechat||r.phone)||s.contactFilter==='no'&&!r.email&&!r.wechat&&!r.phone));}
function renderNav(){const navs=[['overview','home','项目概览'],['discover','search','发现与候选'],['jobs','task','采集任务'],['library','people','达人复核'],['delivery','send','建联交付']];document.getElementById('nav').innerHTML=`<div class="brand row"><span class="brandmark">${ico('spark',20)}</span><div><b>蒲公英</b><small style="display:block;font-size:9px;letter-spacing:2px">CREATOR WORKSPACE</small></div></div><div class="projectpick"><div class="eyebrow">当前合作项目</div><strong>${esc(s.project)}</strong></div><div class="navlabel">工作空间</div>${navs.map(([key,icon,name])=>`<button class="navitem ${s.screen===key?'active':''}" data-action="go:${key}" title="${name}" ${s.screen===key?'aria-current="page"':''}>${ico(icon)}<span class="navtext">${name}</span>${key==='library'?`<span class="navcount">${s.rows.length}</span>`:key==='jobs'&&!['idle','completed','stopped'].includes(s.job.status)?'<span class="navcount">1</span>':''}</button>`).join('')}<div class="sidebarbottom"><button class="navitem ${s.screen==='history'?'active':''}" data-action="go:history" title="历史与分析">${ico('clock')}<span class="navtext">历史与分析</span></button><button class="navitem ${s.screen==='tools'?'active':''}" data-action="go:tools" title="设置与维护">${ico('settings')}<span class="navtext">设置与维护</span></button><div class="user"><span class="avatar">演</span><div class="userinfo"><b style="font-size:11px">演示工作空间</b><small style="display:block;font-size:9px">本机保存 · 虚构数据</small></div></div></div>`;}
function renderTop(){const title={overview:'项目概览',discover:'发现与候选',jobs:'采集任务',library:'达人复核',delivery:'建联交付',history:'历史与分析',tools:'设置与维护'}[s.screen];document.getElementById('top').innerHTML=`<div class="row breadcrumb"><span>合作项目</span>${ico('chev',12)}<span>${esc(s.project)}</span>${ico('chev',12)}<strong>${title}</strong></div><div class="row"><span class="protochip">交互原型 · 虚构数据 · 无外部连接</span><button class="iconbtn prototype-reset" data-action="reset" title="重置虚构演示数据" aria-label="重置虚构演示数据">${ico('clock',15)}</button></div>`;}
function heading(title,desc,actions=''){return `<div class="pagehead row spread"><div><h1>${title}</h1><p>${desc}</p></div><div class="row wrap">${actions}</div></div>`;}
function overviewR2(){const selected=runRows().filter(r=>r.outreach).length;return heading('让下一次合作，从这里开始','把发现、采集和建联留在同一个项目里',btn(ico('plus')+' 新建合作项目','project-new'))+`<div class="projecthero"><div><div class="eyebrow">AUTUMN HOME · 2026</div><h2>${esc(s.project)}</h2><p>寻找真实生活感的家居创作者。优先关注好物分享与空间改造，先复核内容，再决定合作方式。</p><div class="flowline">${['发现','初筛','采集','复核','交付'].map((x,i)=>`<button class="flowstep ${i<3?'done':i===3?'active':''}" data-action="go:${['discover','discover','jobs','library','delivery'][i]}">${i<3?'✓ ':''}${x}</button>`).join('')}</div></div><div class="resume"><span class="eyebrow">接着上次的位置</span><b>还有 ${s.rows.filter(r=>r.status==='待复核').length} 位达人等待复核</b><p>已采集资料保留，无需重新开始。</p><div class="gap"></div>${btn('继续复核 '+ico('arrow'),'go:library','primary')}</div></div><div class="overview-bottom"><div><div class="sectionheading row spread"><h3>本项目采集任务</h3>${btn('查看全部','go:jobs','quiet small')}</div><div class="panel"><div class="taskrow"><div><h3>家居场景 · 第一批</h3><p>今天 14:20 · 公开资料 · 8 位</p></div>${pill('待复核','accent')}<span class="smallstat">完成 8 / 8</span>${btn('复核结果','go:library','small')}</div><div class="taskrow"><div><h3>好物分享 · 第二批</h3><p>尚未创建 · 从候选名单开始</p></div>${pill('草稿')}<span class="smallstat">候选 ${s.rows.length} 位</span>${btn('整理候选','go:discover','small')}</div></div><div class="sectionheading"><h3>待处理事项</h3></div><div class="panel panelpad"><div class="compactrow"><span>${pill(String(s.rows.filter(r=>!r.email&&!r.wechat&&!r.phone).length),'amber')} 位缺少公开联系方式</span>${btn('去补充','view-missing','quiet small')}</div><div class="compactrow"><span>${pill('1','red')} 位采集失败，已有资料仍保留</span>${btn('查看原因','show-failure','quiet small')}</div></div></div><div><div class="sectionheading"><h3>本项目进展</h3></div><div class="panel panelpad"><div class="compactrow"><span class="muted">候选名单</span><strong>${s.rows.length} 位</strong></div><div class="compactrow"><span class="muted">已选建联</span><strong>${selected} 位</strong></div><div class="compactrow"><span class="muted">已准备未发送</span><strong>${s.plan?.prepared?.length||0} 位</strong></div><div class="gap"></div><div class="notice">准备与发送分别记账。已准备的达人仍保留在待建联名单。</div></div></div></div>`;}
function tabs(){const items=runRows();return `<div class="sectiontabs" role="tablist" aria-label="名单视图">${['全部达人','待复核','待补联系','已选建联'].map(t=>`<button role="tab" aria-selected="${s.tab===t}" class="${s.tab===t?'active':''}" data-action="tab:${t}">${t}<span>${t==='全部达人'?items.length:t==='待复核'?items.filter(r=>r.status==='待复核').length:t==='待补联系'?items.filter(r=>!r.email&&!r.wechat&&!r.phone).length:items.filter(r=>r.outreach).length}</span></button>`).join('')}</div>`;}
function filterbar(){return `<div class="filterrow"><div class="searchbox">${ico('search',15)}<input class="input" id="search" aria-label="搜索达人" placeholder="搜索昵称、分类或备注" value="${esc(s.query)}"></div><select id="contact-filter" aria-label="联系方式筛选"><option value="all">全部联系方式</option><option value="yes" ${s.contactFilter==='yes'?'selected':''}>有联系方式</option><option value="no" ${s.contactFilter==='no'?'selected':''}>待补联系方式</option></select>${btn(ico('download')+' 导出',s.screen==='discover'?'candidate-export':'export','small')}<span class="grow"></span><span class="smallstat">${filtered().length} 位</span></div>`;}
function table(){const rows=filtered(),chosen=s.selected.filter(id=>rows.some(r=>r.id===id));return `<div class="listpanel">${chosen.length?`<div class="bulkbar" role="region" aria-label="当前筛选批量操作"><b>已选 ${chosen.length} 位</b>${s.screen==='discover'?btn('标为优先','priority','small')+btn('排除','exclude','small')+btn('创建采集任务','collect','primary small'):btn('选入建联','include','primary small')+btn('补充联系方式','enrich','small')+btn('移出建联','uninclude','small')}${btn('取消选择','clear-selection','quiet small')}</div>`:''}<div class="tablewrap"><table aria-label="${s.screen==='discover'?'候选名单':'达人复核名单'}"><thead><tr><th class="checkcol"><input type="checkbox" aria-label="选择当前筛选全部达人" id="select-filter" ${rows.length&&chosen.length===rows.length?'checked':''}></th><th class="namecol">达人 / 内容方向</th><th style="width:12%">粉丝</th><th class="tableoptional" style="width:13%">图文报价</th><th style="width:19%">${s.screen==='discover'?'初筛状态':'联系方式'}</th><th style="width:19%">${s.screen==='discover'?'采集建议':'跟进'}</th></tr></thead><tbody>${rows.map(r=>`<tr data-row="${r.id}" class="${s.focus===r.id?'focused':''}" tabindex="0" aria-label="查看${esc(r.name)}详情"><td class="checkcol"><input type="checkbox" aria-label="选择${esc(r.name)}" data-select="${r.id}" ${s.selected.includes(r.id)?'checked':''}></td><td><div class="cellname"><span class="avatar s" style="background:${palette[(r.id-1)%8]}">${r.name[0]}</span><div><b>${esc(r.name)}</b><small>${esc(r.category)}</small></div></div></td><td>${r.fans}</td><td class="tableoptional"><span class="muted">¥ ${r.price}</span></td><td>${s.screen==='discover'?pill(r.excluded?'已排除':r.priority,r.excluded?'':r.priority==='优先'?'accent':''):pill(r.email?'邮箱已核实':r.wechat?'微信已核实':r.phone?'手机已核实':'待补联系',r.email||r.wechat||r.phone?'green':'amber')}</td><td>${s.screen==='discover'?`<span class="muted">${r.excluded?'不采集':'待采集'}</span>`:pill(r.outreach?'要建联':r.status,r.outreach?'accent':r.status==='采集失败'?'red':'')}</td></tr>`).join('')}</tbody></table>${!rows.length?`<div class="empty">${ico('search',27)}<h3>没有符合条件的达人</h3><p>名单仍保留，可以清空筛选重新查看</p><div class="gap"></div>${btn('清空筛选','clear-filters')}</div>`:''}</div><div class="footerline"><span>当前筛选 ${rows.length} 位 / 整批 ${s.screen==='discover'?s.rows.length:runRows().length} 位</span><span>所有资料均为虚构</span></div></div>`;}
function inspectorR2(){const r=byId(s.focus);if(!r)return '';return `<aside class="inspect" aria-label="达人详情"><div class="inspecthead"><div class="row spread"><span class="eyebrow">RECORD PREVIEW</span><div class="row">${btn('上一位','prev','quiet small')}${btn('下一位','next','quiet small')}</div></div><div class="inspecttitle"><span class="avatar" style="background:${palette[(r.id-1)%8]}">${r.name[0]}</span><div><h3>${esc(r.name)}</h3><span class="muted">${r.category} · ${r.fans}粉丝</span></div></div></div><div class="inspectbody"><div class="inspecttabs" role="tablist">${['概览','跟进','资料来源'].map(t=>`<button class="${s.detailTab===t?'active':''}" data-action="detailtab:${t}" role="tab" aria-selected="${s.detailTab===t}">${t}</button>`).join('')}</div>${s.detailTab==='概览'?`<div class="attr"><span>初筛判断</span><span>${pill(r.excluded?'已排除':r.priority,r.priority==='优先'?'accent':'')}</span></div><div class="attr"><span>图文报价</span><span>¥ ${r.price}</span></div><div class="attr"><span>邮箱</span><span>${r.email?esc(r.email):'<span class="muted">未找到公开邮箱</span>'}</span></div><div class="attr"><span>微信</span><span>${r.wechat?esc(r.wechat):'<span class="muted">未补充</span>'}</span></div><div class="attr"><span>建联方式</span><span>${r.channel}</span></div><div class="tinytitle">复核备注</div><p style="font-size:12px;color:#918a81;line-height:1.9">${esc(r.note)||'还没有备注，查看内容后记录你的判断。'}</p><div class="actionmenu">${btn(ico('edit',13)+' 编辑资料','edit:'+r.id,'small')}${btn(ico('globe',13)+' 查看主页','browser:detail','small')}</div>`:s.detailTab==='跟进'?`<div class="timeline"><div class="event"><small>今天 14:28</small>采集结果已保存，等待人工复核</div><div class="event"><small>今天 14:12</small>从候选名单加入本项目</div><div class="event"><small>当前</small>${r.outreach?'已人工选入建联，尚未发送':'未选入建联'}</div></div><div class="actionmenu">${btn('修改跟进状态','edit:'+r.id,'small')}</div>`:`<div class="attr"><span>采集来源</span><span>${r.source}</span></div><div class="attr"><span>资料证据</span><span>公开页面 · 演示快照</span></div><div class="attr"><span>账号绑定</span><span class="mono">DEMO_${String(r.id).padStart(3,'0')}</span></div><div class="notice">联系方式只补空值；人工填写的资料不会被重新采集覆盖。</div><div class="actionmenu">${btn('查看证据','evidence','small')}${btn('打开采集结果','go:history','small')}</div>`}</div><div class="inspectfooter row spread"><span class="muted">${r.outreach?'已选建联 · 尚未发送':'由你决定是否建联'}</span>${btn(r.outreach?'移出建联':'选入建联','toggle-outreach:'+r.id,r.outreach?'small':'primary small')}</div></aside>`;}
function libraryR2(){return heading('达人复核','一张名单完成判断，详情与修改留在右侧',btn('补充联系方式','enrich')+btn('生成建联方案 '+ico('arrow'),'plan','primary'))+`<div class="row batchrow" style="margin-bottom:18px"><span class="muted">结果批次</span><select id="run-selector" aria-label="结果批次" style="width:auto;min-width:240px;font-size:12px"><option value="first" ${s.runKey==='first'?'selected':''}>家居场景 · 第一批（8位）</option>${s.job.done?`<option value="current" ${s.runKey==='current'?'selected':''}>新一批采集 · 已保存 ${s.job.done} 位</option>`:''}</select><span class="muted">复核判断按对应批次保存</span></div>`+tabs()+filterbar()+`<div class="listlayout"><section>${table()}<div class="list-meta">${ico('shield',13)}<span>批量勾选只选择操作对象；“选入建联”才改变建联名单</span></div></section>${inspector()}</div>`;}
function discoverR2(){return heading('发现与候选','先保留值得合作的人，再决定采集哪些资料',btn('保存候选草稿','save-candidates')+btn('创建采集任务 '+ico('arrow'),'collect','primary'))+`<div class="sourcechoices" role="tablist" aria-label="名单来源">${['蒲公英搜索','导入名单','粘贴链接'].map(x=>`<button role="tab" aria-selected="${s.source===x}" class="${s.source===x?'active':''}" data-action="source:${x}">${x}</button>`).join('')}</div><div class="discoverlayout"><section><div class="row spread" style="margin-bottom:15px"><div><h3>本项目候选</h3><div class="muted">初筛保留人工判断，重复加入仅更新公开资料</div></div><div class="row">${btn('名单操作','candidate-actions','small')}${btn(ico('download',14)+' 初筛表','candidate-export','small')}</div></div>${filterbar()}${table()}<div class="scopehint">默认采集“优先 + 待复核”；已排除者不会进入采集范围</div></section><aside>${s.source==='蒲公英搜索'?browserPane():`<div class="panel panelpad"><h3>${s.source==='导入名单'?'把已有名单带进来':'粘贴蒲公英达人链接'}</h3><p class="muted" style="margin:9px 0 18px">先预览去重与匹配结果，再决定合并或替换。</p>${s.source==='导入名单'?`<div class="empty" style="padding:25px 0">${ico('file',32)}<h3>候选初筛表.xlsx</h3><p>演示文件 · 6 人，含 2 个重复对象</p></div>`:`<textarea id="links" aria-label="蒲公英达人链接" placeholder="每行一条蒲公英达人链接">https://pgy.xiaohongshu.com/solar/pre-trade/blogger-detail/DEMO_009</textarea>`}<div class="gap"></div>${btn('预览导入差异','import-preview','primary full')}<div class="gap"></div><div class="notice">合并保留名单外的候选；替换须再次确认。初筛状态、备注和排除原因一并保留。</div></div>`}</aside></div>`;}
function browserPaneR2(){return `<div class="webpane"><div class="webtoolbar">${ico('globe',13)}<span class="grow">蒲公英搜索页</span>${pill(s.login?'已人工登录':'待人工登录',s.login?'green':'amber')}</div><div class="webtabs"><button class="active">采集页 · 受保护</button><button data-action="browser:detail">达人详情</button></div><div class="fakeweb"><div class="row spread"><div class="fakehead">达人广场</div>${btn(s.login?'检测登录':'模拟人工登录','login','small')}</div><div class="fakefilters"><span>家居家装</span><span>5–30 万粉丝</span><span>图文合作</span></div><p class="muted">筛选由你在平台完成</p>${s.rows.slice(0,3).map(r=>`<div class="webitem"><span class="avatar">${r.name[0]}</span><div class="grow"><b>${r.name}</b><br><small>${r.fans}粉丝 · 家居好物</small></div>${pill('公开资料')}</div>`).join('')}</div><div class="panelpad" style="border-top:1px solid var(--line)"><label class="field">从当前结果加入候选<input class="input" id="rank-input" value="前 3 位" aria-label="候选读取范围"></label><div style="height:10px"></div>${btn('预览读取范围','rank-preview','primary full')}<div class="scopehint">单次最多 50 人 · 跨排名检查点须人工继续</div></div><div class="webribbon">页面模拟 · 不登录真实平台 · 不发起采集</div></div>`;}
const jobLabels={idle:'尚无运行中的任务',running:'采集中',pause_requested:'暂停请求中',paused:'已安全暂停',stop_requested:'停止请求中',skip_requested:'跳过请求中',stopped:'已停止',completed:'采集完成',risk:'风控已停止',save_error:'结果保存失败',login:'等待人工登录'};
function jobs(){const j=s.job;return heading('采集任务','任务、结果和异常放在同一个上下文里',btn('从候选创建任务','go:discover'))+`<div class="sectiontabs"><button class="active">当前任务</button><button data-action="go:history">历史执行记录</button></div>${j.status==='idle'?`<div class="panel empty">${ico('task',30)}<h3>从一份确认过的候选名单开始</h3><p>先选择范围与规则，启动前再次确认账号和数量</p><div class="gap"></div>${btn('去整理候选','go:discover','primary')}</div>`:`<div class="joblayout"><section class="panel panelpad"><div class="row spread"><div><div class="eyebrow">RUN · DEMO-20261015-02</div><h2 style="margin-top:6px">家居场景 · 新一批采集</h2></div>${pill(jobLabels[j.status],['risk','save_error'].includes(j.status)?'red':j.status==='completed'?'green':'accent')}</div><div class="progress" role="progressbar" aria-valuenow="${j.done}" aria-valuemin="0" aria-valuemax="${j.total}"><div style="width:${j.done/j.total*100}%"></div></div><div class="row spread"><span class="muted">已处理 ${j.done} / ${j.total} 位</span><span class="muted">串行 · 保守等待 · 不跳过安全检查</span></div><div class="jobstats"><div><small>已保存</small><strong>${j.done-(j.skippedIds?.length||0)}</strong></div><div><small>待处理</small><strong>${j.total-j.done}</strong></div><div><small>失败</small><strong>${j.status==='save_error'?1:0}</strong></div><div><small>已跳过</small><strong>${j.skippedIds?.length||0}</strong></div></div><div class="gap"></div>${['pause_requested','stop_requested','skip_requested'].includes(j.status)?`<div class="notice warn">${j.status==='pause_requested'?'暂停':j.status==='skip_requested'?'跳过':'停止'}请求已收到，当前对象到达安全点后才生效。${btn('模拟到达安全点','safe-point','small')}${j.status==='pause_requested'?btn('撤销待暂停','cancel-pause','small'):''}</div>`:j.status==='risk'?`<div class="notice error"><b>平台出现安全验证，整批已停止</b><p>保留已保存的 ${savedCount()} 位。没有继续下一人，也没有自动导航。请人工处理风险，之后重新核对任务。</p><div class="gap"></div>${btn('查看已保存结果','review-job','small')}</div>`:j.status==='login'?`<div class="notice warn"><b>登录已失效</b><p>进度已保留。人工登录并重新检查后才能继续。</p><div class="gap"></div>${btn('打开受保护搜索页','browser:collection function deliveryR2(){const p=s.plan;const eligible=runRows().filter(r=>r.outreach);if(!p)return heading('建联交付','把名单、话术和执行方式核对清楚，再交付',btn('返回达人复核','go:library'))+`<div class="panel empty">${ico('send',30)}<h3>${eligible.length?`已有 ${eligible.length} 位达人选入建联`:'还没有选入建联的达人'}</h3><p>勾选行只是选择批量操作对象；请先确认“选入建联”</p><div class="gap"></div>${btn(eligible.length?'用已选达人生成方案':'去复核达人',eligible.length?'plan':'go:library','primary')}</div>`;const stale=p.status==='stale'||p.version!==s.rev;const rows=p.ids.map(byId).filter(Boolean),current=rows[p.index]||rows[0];return heading('建联交付','名单 → 话术 → 未发送准备 → 导出 / 飞书交接',btn('导出交付表','export')+btn('飞书交接','cloud','primary'))+`<div class="planlayout"><aside><div class="panel"><div class="panelpad" style="border-bottom:1px solid var(--line)"><h3>本次名单 <span class="muted">${rows.length} 位</span></h3><p class="muted">来自 ${esc(s.project)}</p></div>${rows.map((r,i)=>`<button class="recipient ${p.index===i?'active':''}" data-action="recipient:${i}"><span class="avatar s" style="background:${palette[(r.id-1)%8]}">${r.name[0]}</span><div class="grow"><b>${r.name}</b><br><small>${p.prepared.includes(r.id)?'已准备 · 未发送':'等待准备'}</small></div>${p.prepared.includes(r.id)?ico('check',14):''}</button>`).join('')}</div><div class="scopehint">准备不会更改“要建联”勾选或记为已联系</div></aside><section class="panel"><div class="plantop"><div class="row spread"><div class="row"><h3>${esc(current.name)}</h3>${pill(p.prepared.includes(current.id)?'已准备未发送':'待准备',p.prepared.includes(current.id)?'green':'')}</div><span class="smallstat">${p.index+1} / ${rows.length}</span></div><div class="gap"></div><div class="row wrap"><span class="muted">执行方式</span>${['蒲公英邀约','邮件建联','微信交接'].map(c=>btn(c,'channel:'+c,c===p.channel?'primary small':'small')).join('')}</div></div><div class="planbody">${stale?`<div class="notice warn">名单或资料已更改，旧准备已失效。${btn('重新核对本次名单','plan','small')}</div>`:p.unknown?`<div class="notice error"><b>执行结果不明，禁止自动重试</b><p>先核对目标平台上的实际结果，不能再次发送。</p>${btn('模拟只读核对结果','resolve-unknown','small')}</div>`:p.status==='completed'?`<div class="notice success"><b>本批未发送准备已完成</b><p>已处理 ${rows.length}/${rows.length} · 已准备未发送 ${p.prepared.length} · 已发送 0</p></div>`:`<div class="notice">${p.channel==='蒲公英邀约'?'使用独立邀约账号，仅准备当前达人表单；最终发送须人工逐人确认。':p.channel==='邮件建联'?'只交接邮件草稿，不自动补采、不发送邮件。':'只导出普通交接表；本原型不生成可执行小蜜蜂文件。'}</div>`}<div class="row spread" style="margin:21px 0 13px"><h3>合作内容</h3>${btn('修改话术','template','quiet small')}</div><div class="two"><div class="attr"><span>品牌</span><span>秋日居家 DEMO</span></div><div class="attr"><span>产品</span><span>家居香氛演示装</span></div><div class="attr"><span>期望发布</span><span>2026.10.20 – 10.31</span></div><div class="attr"><span>对接方式</span><span>demo@example.test</span></div></div><div class="draftpaper"><span class="eyebrow">MESSAGE PREVIEW</span><h3 style="margin-top:11px">你好，${esc(current.name)}</h3><p style="white-space:pre-wrap">${esc(p.message)}</p><div class="gap"></div><span class="tag">演示话术 · 未发送</span></div><div class="row spread" style="margin-top:17px"><span class="muted">批次准备 ${p.prepared.length} / ${rows.length} · 发送 0</span><span>${btn('执行审批','approval','quiet small')}${btn('查看邀约账号','browser:invite','quiet small')}</span></div></div><div class="plan-actions"><span class="muted">${p.prepared.includes(current.id)?'已回读模拟表单 · 等待你的下一步':'只准备当前对象，不自动切到下一位'}</span><div class="row wrap">${p.channel==='邮件建联'?btn('查看邮箱交接','mail-handoff','primary'):p.channel==='微信交接'?btn('导出普通交接表','export','primary'):p.prepared.includes(current.id)&&p.status!=='completed'?btn(p.index<rows.length-1?'不发送，准备下一位':'不发送，完成本批准备','unsent-next','primary'):btn(p.status==='completed'?'准备已完成':p.status==='preparing'?'准备中…':'仅准备，不发送','prepare','primary',stale||p.unknown||p.status==='completed'||p.status==='preparing'?'disabled':'')}${btn('最终发送','no-send','','disabled title="原型不提供真实发送"')}</div></div></section></div>`;}

function openDialog(title,body,foot='',wide=false){const d=document.getElementById('modal');dialogGeneration++;d.getAnimations().forEach(a=>a.cancel());if(!d.open)returnFocus=document.activeElement;d.className='dialog'+(wide?' wide':'');d.innerHTML=`<div class="dialoghead row spread"><div><h2 id="dialog-title">${title}</h2></div><button class="iconbtn" data-action="close" aria-label="关闭弹窗">${ico('close')}</button></div><div class="dialogbody">${body}</div>${foot?`<div class="dialogfoot">${foot}</div>`:''}`;if(!d.open)d.showModal();d.scrollTop=0;}
async function closeDialog(){const d=document.getElementById('modal');if(!d.open)return;const generation=dialogGeneration;if(motion())await d.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(6px)'}],{duration:110}).finished.catch(()=>{});if(generation!==dialogGeneration)return;d.close();d.innerHTML='';if(returnFocus?.isConnected)returnFocus.focus();else document.getElementById('main').focus({preventScroll:true});}

document.addEventListener('click',async e=>{const checkbox=e.target.closest('[data-select]');if(checkbox){const id=Number(checkbox.dataset.select);s.selected=checkbox.checked?[...new Set([...s.selected,id])]:s.selected.filter(x=>x!==id);paint();return;}if(e.target.id==='select-filter'){const ids=filtered().map(r=>r.id);s.selected=e.target.checked?[...new Set([...s.selected,...ids])]:s.selected.filter(id=>!ids.includes(id));paint();return;}const actionEl=e.target.closest('[data-action]');if(!actionEl){const row=e.target.closest('[data-row]');if(row){s.focus=Number(row.dataset.row);if(s.screen==='discover')edit(s.focus);else paint(true);}return;}if(actionEl.disabled)return;const a=actionEl.dataset.action;const [kind,...parts]=a.split(':');const val=parts.join(':');if(kind==='go'){go(val);return;}if(kind==='close'){await closeDialog();return;}if(kind==='demo'){toast(val);return;}if(kind==='tool'){tool(val);return;}if(kind==='tab'){s.tab=val;s.selected=[];paint(true);return;}if(kind==='detailtab'){s.detailTab=val;paint(true);return;}if(kind==='source'){s.source=val;paint(true);return;}if(kind==='edit'){edit(Number(val));return;}if(kind==='browser'){openDialog('网页工作区 · '+({collection:'受保护搜索页',detail:'达人详情',contacts:'联系方式补采',invite:'独立邀约账号',mail:'企业邮箱'}[val]||'详情'),`<div class="notice">角色隔离；搜索页的筛选、页号与滚动保留。此处是虚构页面，不连接真实账号。</div><div class="gap"></div><div class="webtabs">${['采集页（受保护）','详情页','补采账号','邀约账号','企业邮箱'].map((x,i)=>`<button data-action="browser:${['collection','detail','contacts','invite','mail'][i]}">${x}</button>`).join('')}</div><div class="fakeweb"><h2>${val==='mail'?'邮件草稿':val==='invite'?'当前达人邀约表单':val==='contacts'?'小红书公开资料':val==='collection'?'蒲公英搜索结果 · 第1页':esc(byId(s.focus)?.name)}</h2><p class="muted" style="margin:12px 0">账号角色 · ${val} · 演示页面</p><div class="notice">手工登录、验证及风控交给操作人。自动化锁期间不能改变目标角色。</div><div class="actionmenu">${btn('后退','demo:模拟返回原历史条目')}${btn('前进','demo:模拟前进到已验证条目')}${btn('刷新','demo:模拟刷新；实际需重新核验')}${btn('返回搜索结果','browser:collection')}${btn('检测登录','demo:模拟检测通过，不证明实际登录')}</div></div>`,btn('回到工作台','close'),true);return;}if(kind==='toggle-outreach'){const r=byId(val);r.outreach=!r.outreach;if(r.outreach)r.status='待建联';invalidate();paint();toast(r.outreach?'已选入建联，尚未准备或发送':'已移出建联');return;}if(kind==='channel'){s.approval=null;s.plan.channel=val;s.plan.prepared=[];s.plan.status='draft';s.plan.unknown=false;paint();toast('执行方式已更改，旧准备已撤销');return;}if(kind==='recipient'){if(s.plan.status==='preparing'){toast('当前对象正在准备，请先等待本次回读');return;}s.plan.index=Number(val);paint(true);return;}

function restoreBrowserScroll(){const node=document.querySelector('.browser-content');if(node){const session=browserSession(node.dataset.role);node.scrollTop=session.scrollTop||0;}}
let workspaceObserver,layoutFrame;
function observeWorkspace(){workspaceObserver?.disconnect();const host=document.querySelector('.workspace-shell');if(host){workspaceObserver=new ResizeObserver(scheduleWorkspaceLayout);workspaceObserver.observe(host);}scheduleWorkspaceLayout();}
function scheduleWorkspaceLayout(){cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(()=>setBrowserWidth(s.browser.width,false));}
addEventListener('resize',scheduleWorkspaceLayout);visualViewport?.addEventListener('resize',scheduleWorkspaceLayout);
function setBrowserWidth(value,save=true){const host=document.querySelector('.workspace-shell'),space=host?.clientWidth||innerWidth-204;host?.classList.toggle('stacked-browser',space<782);const max=Math.max(340,space-442),width=Math.round(Math.max(340,Math.min(max,Number(value)||530)));s.browser.width=width;document.documentElement.style.setProperty('--browser-width',width+'px');const split=document.getElementById('browserSplitter');if(split){split.setAttribute('aria-valuenow',width);split.setAttribute('aria-valuemax',Math.round(max));}if(save)persist();}
function showBrowserContract(){openDialog('原生 BrowserView · 接入保留契约',`<div class="notice warn">这里仅有离线交互模拟。未连接原生 BrowserView，不证明真实账号、布局或会话已验收。</div><ul class="browser-contract"><li>名单、详情和原生网页同屏；主进程按实际网页宿主矩形和缩放更新 bounds，不靠原型CSS证明原生坐标。</li><li>收起仅隐藏或移出可见区域，保留同一个允许域 WebContents 与角色会话，不销毁、不重新加载入口。</li><li>采集搜索页独立受保护；详情、补采、邀约和邮箱保持各自角色与partition，不复制 Cookie。</li><li>搜索条件、页号、滚动和历史沿原WebContents保留；继续浏览优先返回原历史条目。</li><li>拖宽后重算网页布局；菜单/弹窗覆盖、键盘/IME跨网页焦点需在Electron原生回归。</li><li>登录/验证码/风控由人工处理；模拟登录标记不能证明真实登录。原生与安装版阶段另验收。</li></ul>`,btn('了解，返回原型','close','primary'),true);}

 if(action==='cloud-preview'){
  stop();if(!document.getElementById('cloud-owner').value){toast('明确选择经纪人后才可预览');return;}const rows=handoffRows(),mode=document.getElementById('cloud-mode').value,batch='DEMO-R3-20261016';s.cloud={mode,ids:rows.map(r=>r.id),version:s.rev,runIdentity:runIdentity(),batch};
  openDialog(mode==='test-create'?'AI测试建档 · 首次创建预览':'本次字段差异 · '+rows.length+'位',`<p class="muted">来源：${esc(scopeLabel())} · 本次${rows.length}位 · 明确经纪人DEMO-01</p>${mode==='test-create'?`<div class="notice warn" style="margin:14px 0"><b>首次创建标题：[AI测试] ${rows.map(row=>esc(row.name)).join('、[AI测试] ')}</b><p>精确批次：${batch}；模式：test；已确认标记与精确清理能力后才演示创建。不得拿正式记录试写。</p></div>`:''}<div class="resource-preview" style="margin:14px 0"><table style="min-width:500px"><thead><tr><th>对象</th><th>字段</th><th>当前值</th><th>将写入</th></tr></thead><tbody>${rows.slice(0,5).map(row=>`<tr><td>${esc(row.name)}</td><td>联系方式 / 备注</td><td>原有值保留</td><td>仅演示字段差异</td></tr>`).join('')}</tbody></table></div><div class="notice">${mode==='enrich'?'正式补录只核对目标账号、平台、经纪人与将写字段；保留归属、原建联时间和流程。':mode==='test-create'?'本次只演示带标志与批次的新测试记录，精确审计与清理独立，未授权真实写入。':'正式记录使用昵称；提交时生成建联时间，保留必填检查，禁止进入测试清理。'}</div><div class="gap"></div><label class="check"><input type="checkbox" id="cloud-ack">已核对目标、人数和将改字段，仅模拟确认与回读</label>`,btn('返回','cloud')+btn('模拟确认与回读','cloud-confirm','primary'),true);return;
 }
 if(action==='cloud-confirm'){stop();const c=s.cloud;if(!c||c.version!==s.rev||c.runIdentity!==runIdentity()||!document.getElementById('cloud-ack')?.checked){toast('本次差异确认已失效或尚未核对');return;}if(c.mode==='test-create'){const stamp=Date.now();for(const id of c.ids)s.mockTestRecords.push({name:'[AI测试] '+byId(id).name,batch:c.batch,mode:'test',sourceId:id,id:'DEMO-TEST-'+stamp+'-'+id});}s.cloud=null;openDialog('模拟回读完成',`<div class="notice success">本次${c.ids.length}位模拟回读与预览一致；真实请求0。</div><div class="gap"></div><p>${c.mode==='test-create'?'测试记录在首次模拟创建时已有[AI测试]和精确批次。':'正式记录仍受保护，不进入测试清理。'}</p>`,btn('返回交付','close','primary')+btn('演示结果不明保护','unknown','small'));persist();return;}
 if(kind==='export-mode'){stop();exportDialog(value==='resource'?'resource':value==='raw'?'raw':false);return;}
 if(action==='resource-export'){stop();exportDialog('resource');return;}
 if(kind==='download'){
  stop();const candidate=value==='true',scope=document.getElementById('export-scope').value,rows=exportRows(scope,candidate),full=s.exportMode==='resource'||s.exportMode==='raw';const columns=full?resourceColumns:[['name','达人昵称'],['priority','初筛判断'],['status','跟进状态'],['email','邮箱'],['wechat','微信'],['phone','手机'],['outreach','要建联']];const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[columns.map(([,label])=>label),...rows.map(row=>columns.map(([key])=>key==='account'?'DEMO_XHS_'+row.id:key==='outreach'?(row.outreach?'是':'否'):row[key]))].map(row=>row.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=full?'虚构演示-完整达人资源表.csv':'虚构演示-建联交付表.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);s.exports.push({name:link.download,count:rows.length,scope:scopeLabel()+' / '+scope});await closeDialog();paint();toast('普通CSV已导出'+rows.length+'行；含手机字段，无可执行文件');return;
 }
},true);
document.addEventListener('input',event=>{
 if(event.target.id==='search'){event.stopImmediatePropagation();s.query=event.target.value;s.selected=[];refreshRecords();return;}
 if(event.target.matches('[data-mock-form]')){event.stopImmediatePropagation();if(s.plan){invalidate();const notice=document.createElement('p');notice.className='save-error';notice.textContent='模拟表单已变化，旧准备已撤销。';event.target.closest('.mock-form').querySelector('.save-error')?.remove();event.target.closest('.mock-form').appendChild(notice);persist();toast('内容改变，旧准备撤销；未发送');}return;}
},true);
document.addEventListener('change',event=>{
 if(event.target.id==='run-selector'){event.stopImmediatePropagation();switchRun(event.target.value);paint();toast('所有切批入口统一撤销旧准备与审批，当前行已归位');return;}
 if(event.target.id==='contact-filter'){event.stopImmediatePropagation();s.contactFilter=event.target.value;s.selected=[];refreshRecords();return;}
 if(event.target.id==='collect-scope'){event.stopImmediatePropagation();const ids=finalCollectionIds(event.target.value);document.getElementById('collect-count').textContent=ids.length+'位 / 含排除'+ids.filter(id=>byId(id).excluded).length+'位 / 上限50';return;}
},true);
document.addEventListener('scroll',event=>{const node=event.target;if(node.matches?.('.browser-content')){const session=s.browser.sessions[node.dataset.role];if(session&&node.dataset.viewKey===browserKey(session)){session.scrollTop=node.scrollTop;persist();}}else if(node.matches?.('#record-table .tablewrap')){recordReadings.set(listKey(),node.scrollTop);}},true);
document.addEventListener('pointerdown',event=>{if(event.target.id!=='browserSplitter')return;event.preventDefault();event.target.setPointerCapture(event.pointerId);dragBrowser={pointerId:event.pointerId,startX:event.clientX,width:s.browser.width};});
document.addEventListener('pointermove',event=>{if(!dragBrowser||dragBrowser.pointerId!==event.pointerId)return;setBrowserWidth(dragBrowser.width+dragBrowser.startX-event.clientX);});
document.addEventListener('pointerup',event=>{if(dragBrowser?.pointerId===event.pointerId){dragBrowser=null;persist();}});
document.addEventListener('dblclick',event=>{if(event.target.id==='browserSplitter')setBrowserWidth(530);});
document.addEventListener('keydown',event=>{if(event.target.id!=='browserSplitter')return;let width=s.browser.width;if(event.key==='ArrowLeft')width+=20;else if(event.key==='ArrowRight')width-=20;else if(event.key==='Home')width=340;else if(event.key==='End')width=99999;else return;event.preventDefault();setBrowserWidth(width);});
window.prototypeState=()=>JSON.parse(JSON.stringify(s));window.prototypeReset=()=>{s=initial();recordReadings.clear();paint();};

paint();
</script></body></html>

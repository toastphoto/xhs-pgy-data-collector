<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小红书相关信息采集工具</title>
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./workbench.css" />
    <link rel="stylesheet" href="./native-workbench.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <div id="body">
        <!-- 左侧：任务工作台 UI -->
        <div id="console">
          <aside id="sidebar"></aside>
          <div id="splitterSidebar" class="splitter" role="separator" aria-label="调整侧边栏宽度" aria-orientation="vertical" tabindex="0" title="拖动调整侧边栏宽度；双击恢复默认"></div>
          <section id="content"></section>
        </div>

        <div id="splitterMain" class="splitter" role="separator" aria-label="调整工作台与网页区域宽度" aria-orientation="vertical" tabindex="0" title="拖动调整左右区域宽度；双击恢复默认"></div>

        <!-- 右侧：网页操作区由主进程内嵌渲染在这块区域 -->
        <div id="browserHost">
          <div class="hint">
            右侧是网页操作区。<br />
            在上方输入蒲公英网址，或在任务页点击“打开蒲公英搜索”。<br />
            网页打开后，可以在这里登录、搜索和查看达人详情；补采联系方式时也会在这里打开小红书主页。
          </div>
        </div>
      </div>
    </div>

    <script src="./runtime_errors.js"></script>
    <script type="module">
      import('./app.js').catch((err) => (window.__renderAppError ? window.__renderAppError(err, true) : null));
    </script>
  </body>
</html>

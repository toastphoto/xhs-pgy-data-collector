<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容采集工具（桌面内嵌版）</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <div id="topbar">
      <div class="left">
        <div class="brand">内容采集工具</div>
        <div id="backendStatus" class="status">后端：启动中…</div>
      </div>

      <div class="right">
        <input id="urlInput" placeholder="输入蒲公英网址，回车打开右侧网页" />
        <button id="btnGo">打开</button>
        <button id="btnBack">后退</button>
        <button id="btnForward">前进</button>
        <button id="btnReload">刷新</button>

        <div class="divider"></div>

        <button id="btnRecStart">开始录制</button>
        <button id="btnRecStop" disabled>停止并保存</button>
        <span id="recCount" class="muted">0</span>

        <select id="recFiles"></select>
        <button id="btnReplay">回放</button>
      </div>
    </div>

    <div id="layout">
      <!-- 左侧：你的原有前端（由后端服务提供 UI），在桌面 App 内嵌显示 -->
      <div id="leftPane">
        <iframe id="appFrame" title="工具面板" src="about:blank"></iframe>
      </div>

      <!-- 右侧：网页操作区由主进程内嵌渲染在这块区域 -->
      <div id="rightPane">
        <div class="hint">
          右侧是网页操作区。<br />
          在这里登录蒲公英、搜索达人、打开达人详情页。<br />
          上方可开始录制并保存操作，之后回放。
        </div>
      </div>
    </div>

    <script src="./shell.js"></script>
  </body>
</html>
